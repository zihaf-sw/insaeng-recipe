<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인생레시피 OG 이미지 원본</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F5F4EE; color: #1D2433; font-family: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
    display: grid; grid-template-columns: 620px 1fr; align-items: center; padding: 0 90px 0 80px; box-sizing: border-box;
    position: relative;
  }
  body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #2B4A7E; }
  .brand { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 30px; display: flex; align-items: baseline; gap: 12px; }
  .brand small { font-family: "Nanum Pen Script", cursive; font-size: 30px; color: #E3A92B; font-weight: 400; }
  h1 { font-family: "Gowun Batang", serif; font-size: 62px; line-height: 1.28; margin: 28px 0 0; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: #2B4A7E; }
  p { font-size: 25px; color: #545B69; margin: 26px 0 0; line-height: 1.5; }
  .recipe {
    background: #FFFEFA; border: 1px solid #D6D3C7; padding: 34px 34px 28px; transform: rotate(-2deg);
    box-shadow: 0 24px 50px -24px rgba(29,36,51,.4);
    background-image: repeating-linear-gradient(to bottom, transparent 0 41px, #D6D3C7 41px 42px); background-position: 0 84px;
    position: relative; justify-self: end; width: 380px;
  }
  .tape { position: absolute; top: -14px; left: 50%; width: 130px; height: 30px; transform: translateX(-50%) rotate(3deg); background: #F7E8C4; }
  .who { font-size: 16px; color: #545B69; }
  .recipe h2 { font-family: "Nanum Pen Script", cursive; font-weight: 400; font-size: 50px; margin: 10px 0 0; line-height: 1.1; }
  .recipe ol { font-family: "Nanum Pen Script", cursive; font-size: 32px; line-height: 42px; margin: 12px 0 0; padding-left: 30px; }
  .memo { font-family: "Nanum Pen Script", cursive; font-size: 30px; color: #2B4A7E; margin-top: 10px; line-height: 1.3; }
</style>
</head>
<body>
  <div>
    <div class="brand">인생레시피 <small>할머니의 지혜 배달</small></div>
    <h1>할머니의 <em>60년 김장</em>이<br>당신의 첫 자취 밥상이<br>됩니다</h1>
    <p>AI 안부전화로 찾은 어르신의 지혜를<br>청년의 하루로 잇는 생활 클래스</p>
  </div>
  <div class="recipe">
    <span class="tape"></span>
    <div class="who">이순자 선생님 · 81세 · 강원 정선</div>
    <h2>자취생 3일 김치</h2>
    <ol>
      <li>알배추 반 통, 소금 두 줌</li>
      <li>고춧가루·액젓·마늘 1:1:1</li>
      <li>반찬통에 꾹꾹</li>
    </ol>
    <div class="memo">"실패할 게 없어, 걱정 말아."</div>
  </div>
</body>
</html>
